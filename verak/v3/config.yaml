split: {seed: 13, train_fraction: 0.8}
view_token_budget: 3000
view:
  format: compact
  full_view_debug_only: true
  overflow: exclude_essay
bareun: {host: 127.0.0.1, port: 5656, api_key_env: BAREUN_API_KEY, timeout_s: 30}
scorer:
  mode: expected
  max_input_tokens: 3072
  max_new_tokens: 32
  gpu: 1
  load_in_4bit: true
  seed: 42
  cache: true
  average_k: 1
  average_seed: 13
teacher:
  model: gpt-5-mini
  reasoning_effort: low
  phase_api_ceiling: 700
  max_output_tokens: 4096
  timeout_s: 90
ec_judge:
  model: gpt-6.1-sol  # Confirmed by the account's GET /v1/models on 2026-10-05.
  reasoning_effort: high
  phase_api_ceiling: 220
  max_output_tokens: 8192
  timeout_s: 180
  sample_seed: 23
  sample_size: 100
  pilot_size: 10
  input_usd_per_million: 2.0
  output_usd_per_million: 10.0
  projected_cost_limit_usd: 20.0
structure_judge:
  model: gpt-6.1-sol
  reasoning_effort: high
  phase_api_ceiling: 560
  max_output_tokens: 4096
  timeout_s: 180
  sample_seed: 29
  pilot_per_check: 5
  input_usd_per_million: 2.0
  output_usd_per_million: 10.0
  projected_cost_limit_usd: 15.0
phase2c_judge:
  model: gpt-6.1-sol
  reasoning_effort: high
  phase_api_ceiling: 470
  max_output_tokens: 4096
  timeout_s: 180
  sample_seed: 31
  pilot_per_check: 5
  input_usd_per_million: 2.0
  output_usd_per_million: 10.0
  projected_cost_limit_usd: 10.0
structure_policy:
  mode: structural_dependency
  level_weights: {WORD: 1, SENTENCE: 1, TEXT: 1}
  ec_relations: UNAMBIGUOUS_coarse_only
  ec_swap: different_coarse_classes_only
  dependent_edges: DEP_only
  antecedent_identity: debug_only
  conjunctions: closed_coarse_set_only
  style: last_unquoted_clause_final_EF
  dependency_recovery_from_phase: 4
  dependency_recovery: predecessor_restored_or_explicit_subject
  exclude_multi_unit_corruption_targets: true
  phase3_gate_required: false  # User accepted omission as a positional hint; gate corruption data.
  dependency_signal: positional_hint
  coupled_signal_weights: {CONJ: 1.0, DEP: 0.5}
corruption:
  seed: 13
  per_essay: 2
  qc_seed: 37
  qc_essays: 60
  phase_api_ceiling: 100
  vague_model: gpt-5-mini
  vague_reasoning_effort: low
  vague_generation_limit: 24
  judge_model: gpt-6.1-sol
  judge_reasoning_effort: high
  qc_threshold: 0.8
  local_level_weights: {WORD: 1, SENTENCE: 1, TEXT: 1}
  vague_input_usd_per_million: 0.25
  vague_output_usd_per_million: 2.0
  judge_input_usd_per_million: 2.0
  judge_output_usd_per_million: 10.0
corruption_pilot:
  filtering: instance_all_records_pass
  seed: 13
  per_essay: 3
  sample_seed: 41
  sample_size: 100
  phase_api_ceiling: 100
  judge_model: gpt-6.1-sol
  judge_reasoning_effort: high
  removed_operators: [L_TRANSLATIONESE, G_VAGUE]
  local_level_weights: {WORD: 1, SENTENCE: 1, TEXT: 1}
  score_corrupted: false
  full_filter_requires_approval: true
corruption_finalize:
  judge_model: gpt-6.1-sol
  judge_reasoning_effort: high
  cumulative_api_ceiling: 7797
  cumulative_cost_cap_usd: 50.0
  cost_policy: confirmed_usage_plus_timeout_reservations_5xx_without_usage_zero
  max_concurrency: 4
  max_retries: 3
  retry_delays_s: [10, 40, 120]
  transport_timeout_s: 600
  error_window: 50
  error_5xx_pause_threshold: 0.20
  error_pause_s: 600
  reuse_pilot: true
  balance_seed: 41
  local_share_min: 0.28
  local_share_max: 0.38
  remove_text_heavy_first: true
  score_corrupted: true
  scorer_average_k: 1
reward:
  quality:
    enabled_from_phase: 4
    scorer_method: score
    average_k_key: scorer.average_k
    noise_floor: 0.5294307612337095
    noise_floor_by_genre:
      설명: 0.71466138
      논증: 0.21266690
      정서: 0.52354468
    noise_floor_file: verak/v3/data/scorer_noise_averaged.json
    noise_floor_scope: genre_paraphrase_k1_with_overall_fallback
    dead_zone: true
    divisor: 2.0
    clip: false
    formula: "sign(delta_q) * max(0, abs(delta_q) - noise_floor_by_genre.get(genre, noise_floor)) / 2"
check:
  enabled_from_phase: 5
  quality_source: score
  average_k_key: scorer.average_k
  show_noise_floor: true
  noise_floor_key: reward.quality.noise_floor
  noise_floor_by_genre_key: reward.quality.noise_floor_by_genre
