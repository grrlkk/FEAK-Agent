version: verak-v3-phase3b-retry
paths:
  repo: /home/chanwoo/FEAK-Agent
  valid: data/data_jsonl/valid.jsonl
  metadata: verak/v3/data
  output: verak/v3/outputs/phase1
  phase2_output: verak/v3/outputs/phase2
  phase2b_output: verak/v3/outputs/phase2b
  phase2c_output: verak/v3/outputs/phase2c
  phase3_output: verak/v3/outputs/phase3
  phase3b_output: verak/v3/outputs/phase3b
