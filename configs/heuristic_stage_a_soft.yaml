weak_rubric_top_n: 3
n_per_action: 1
proposer:
  mode: auto
  model: gpt-4o-mini
  temperature: 0.2
  timeout: 30
patcher:
  mode: auto
  model: gpt-4o-mini
  temperature: 0.1
  timeout: 30
surface_normalizer:
  # Stage A baseline keeps this off unless a run explicitly enables it.
  # This keeps the 100-row baseline comparable to prior Kanana+heuristic logs.
  mode: off
  timeout: 20
  api_key_env: BAREUN_API_KEY
  api_url_env: BAREUN_API_URL
  api_url: https://api.bareun.ai/bareun.RevisionService/CorrectError
  allowed_categories:
    - SPACING
    - TYPO
    - GRAMMER
    - WORD
  max_char_edit_ratio: 0.2
  min_length_ratio: 0.8
  max_length_ratio: 1.25
  max_sentence_count_delta: 1
  reject_new_numbers: true
accept_threshold: 0.0
rubric_score_range: 8
hard_constraints:
  # Provisional soft-score threshold for Stage A baseline only.
  # rf_corrected_score m=10 rerun max|diff| was 0.225 on the 5-row noise sweep,
  # so 0.3 is just above that observed rerun noise ceiling.
  target_gain_min: 0.3
  # Kept unchanged for the baseline; the 20-row sweep showed this was not the
  # main decision bottleneck compared with target_gain_min.
  non_target_drop_max: 1.0
  edit_ratio_max: 0.5
  # Calibrated for BAAI/bge-m3 cosine similarity on the 2026-07-19 labeled
  # set: all 47 known-good edits scored >= 0.9637, half of the known-bad
  # scored below 0.95. If similarity falls back to token retention (no local
  # embedding model), lower this back to 0.7 — token retention runs ~0.9 for
  # legitimate paraphrases and 0.95 would mass-reject them.
  goal_preservation_min: 0.95
  evidence_match_min: 0.3
weights:
  target_gain: 2.0
  target_gap_reduction: 1.0
  evidence_match: 0.5
  goal_preservation: 0.5
  non_target_drop: -2.0
  edit_ratio: -0.5
validity:
  enabled: true
  min_after_chars: 5
  replace_min_ratio: 0.3
  essay_min_ratio: 0.6
  require_sentence_ending: true
  # Guards from the 2026-07-17 qualitative review: patches that invent
  # numbers/citations or duplicate an existing sentence slip past every
  # transition metric (the fabrication cases scored goal_preservation=1.0).
  reject_new_numbers: true
  reject_new_claim_markers: true
  near_dup_overlap: 0.6
  near_dup_jaccard: 0.35
