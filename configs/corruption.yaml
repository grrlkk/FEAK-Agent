# Corruption chain generation (see 중간정리/CORRUPTION_GEN_DECISIONS_2026-07-22.md)
seed: 20260722
depth: 3
llm:
  model: gpt-4o-mini
  temperature: 0.5
  timeout: 60
  max_attempts: 3
validity:
  # State length bounds relative to the source essay x0.
  min_ratio_vs_source: 0.6
  max_ratio_vs_source: 1.8
  insertion_min_chars: 10
  insertion_max_chars: 250
# Edits per step. Pilot v1 (one sentence per step) moved rubric scores by
# only ~+0.06 — below the m=10 rerun noise ceiling (0.225) — on both
# scorer-seen and scorer-unseen essays, so single-sentence corruption is
# too weak for essay-level scoring. v2 degrades several sentences per step.
intensity:
  drop_detail_spans: 2
  insert_offtopic_count: 2
  verbose_spans: 2
  shuffle_moves: 2
  flatten_spans: 4
