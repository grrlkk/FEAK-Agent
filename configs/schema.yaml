# FEAK-TC v2 G0 schema.
# Captured from KananaDiagnoser.diagnose(...) outputs and checked across the
# 2026-07-23 v2 corruption pilot measurements. This file fixes names and order
# only; it does not map features to corruption operators or optimization goals.
