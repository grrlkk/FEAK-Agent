version: rv-pilot-v2

input:
  staging_dataset: experiments/results/rv_data_pilot_50_v2_candidates.jsonl
  candidate_judge_prefix: experiments/results/rv_data_pilot_50_v2_candidate_judge

output:
  retry_cache: experiments/results/rv_data_pilot_50_v2_strong_retry_cache.jsonl
  retry_report: experiments/results/rv_data_pilot_50_v2_strong_retry_report.json

regeneration:
  model: gpt-5-mini-2025-08-07
  reasoning:
    effort: low
  text:
    verbosity: low
  workers: 4
  timeout: 180
  max_attempts: 5
  validation:
    min_length_ratio: 0.60
    max_length_ratio: 2.00
    wrong_target_min_edit_ratio: 0.02
    wrong_target_max_edit_ratio: 0.45
    over_edit_min_reference_edit_ratio: 0.08
    over_edit_min_changed_chars: 70
    strong_wrong_target_min_edit_ratio: 0.05
    strong_over_edit_min_reference_edit_ratio: 0.10
    strong_over_edit_min_changed_chars: 100
