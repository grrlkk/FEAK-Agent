[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feak-tc"
version = "0.1.0"
description = "FEAK-guided Transition Control research utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.0",
    "python-dotenv",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
verak = [
    "bareunpy==1.6.6",
]
g2 = [
    "lightgbm>=4.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["feak_tc*", "verak", "verak.src"]

[tool.setuptools.package-data]
"feak_tc.web" = ["static/*.html", "static/*.css", "static/*.js"]
"feak_tc.review" = ["static/*.html", "static/*.css", "static/*.js"]
"verak" = ["config.yaml", "prompts/*.txt", "lexicons/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "verak/tests"]
pythonpath = ["."]
