[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feak-tc"
version = "0.1.0"
description = "FEAK-guided Transition Control research utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pymongo>=4.6",
    "python-dotenv",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
g2 = [
    "lightgbm>=4.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]
tvm = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "numpy>=1.26",
    "peft>=0.15",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "transformers>=4.48",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["feak_tc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
